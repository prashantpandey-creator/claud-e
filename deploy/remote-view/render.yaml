# Render blueprint for the read-only remote VIEW.
# Free tier, no credit card. Deploys the Dockerfile in this directory, which runs
# the exact, tested remote.py (test_remote.py, 4/4). Render injects $PORT and a
# public HTTPS URL. Both tokens are generated by Render — nothing is baked in and
# the owner never types a secret. Read VIEW_SECRET off the Render dashboard once;
# the phone URL is  https://<service>.onrender.com/?k=<VIEW_SECRET>
#
# One-time owner step (no card): render.com -> sign in with GitHub -> New ->
# Blueprint -> pick the repo that holds deploy/remote-view/ -> Apply.
#
# Note: free web services sleep after ~15 min idle (30-60s cold start). The
# heartbeat push and the first phone view both wake it; that is acceptable for a
# glance-at-your-brain view, not a hot path.
services:
  - type: web
    name: meditate-remote-view
    runtime: docker
    plan: free
    rootDir: deploy/remote-view
    envVars:
      - key: INGEST_TOKEN
        generateValue: true   # Render mints it; used by `meditate remote push`
      - key: VIEW_SECRET
        generateValue: true   # Render mints it; goes in the phone URL's ?k=
