<script type="x-shader/x-vertex" id="vs">
varying vec2 vUv;
void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
</script>
<script type="x-shader/x-fragment" id="fs">
precision highp float;
varying vec2 vUv;
uniform float uTime, uAwake, uLoad, uAspect;
float hash(vec2 p){ return fract(sin(dot(p, vec2(41.3,289.1))) * 43758.5453); }
void main(){
  // aspect corrected HERE, not by scaling the mesh: scaling the quad
  // under an orthographic camera stretched the iris into an ellipse
  // that overflowed the canvas.
  vec2 p = vUv * 2.0 - 1.0;
  p.x *= uAspect;
  float r = length(p);
  float a = atan(p.y, p.x);
  float iris = mix(0.16, 0.24, uAwake);
  float core = smoothstep(iris, iris - 0.09, r);
  float breathe = 0.5 + 0.5 * sin(uTime * mix(0.7, 2.4, uAwake));
  float ring = smoothstep(0.016, 0.0, abs(r - (0.34 + 0.012 * breathe)));
  float spokes = smoothstep(0.86, 1.0, abs(sin(a * 6.0 + uTime * 0.35)))
               * smoothstep(0.012, 0.0, abs(r - 0.42)) * uLoad;
  float grain = (hash(floor(vUv * 220.0) + floor(uTime * 8.0)) - 0.5) * 0.022;
  vec3 gold = vec3(0.890, 0.694, 0.251);
  float lum = core * (0.30 + 0.55 * uAwake + 0.18 * breathe) + ring * 0.85 + spokes * 0.9;
  float halo = smoothstep(1.0, iris, r) * 0.12 * uAwake;
  vec3 col = gold * (lum + halo) + grain;
  gl_FragColor = vec4(col, min(1.0, lum + halo + 0.02));
}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
const H = {"X-Meditate":"1"};
const MARK = [
"   ██████╗ ██╗      █████╗  ██╗   ██╗ ██████╗        ███████╗",
"  ██╔════╝ ██║     ██╔══██╗ ██║   ██║ ██╔══██╗       ██╔════╝",
"  ██║      ██║     ███████║ ██║   ██║ ██║  ██║ █████╗█████╗",
"  ██║      ██║     ██╔══██║ ██║   ██║ ██║  ██║ ╚════╝██╔══╝",
"  ╚██████╗ ███████╗██║  ██║ ╚██████╔╝ ██████╔╝       ███████╗",
"   ╚═════╝ ╚══════╝╚═╝  ╚═╝  ╚═════╝  ╚═════╝        ╚══════╝"].join("\n");
document.getElementById("mark").textContent = MARK;
const esc = s => { const d=document.createElement("i"); d.textContent = s==null?"":String(s); return d.innerHTML; };
let SECTIONS = [], STATE = {}, uni = null, LAST_SERIES = null, LAST_PLAN = null;

async function act(action, arg, btn){
  // A click used to fire and say nothing until the answer landed — on a
  // dispatch that is several seconds of a page that looks broken. The button
  // holds its own state now: label -> "working…" -> the first line of what
  // actually happened, restored after. Feedback belongs where the finger is.
  const say = document.getElementById("say");
  const was = btn ? btn.textContent : null;
  if(btn){ btn.textContent = "working…"; btn.disabled = true; btn.style.opacity = ".6"; }
  say.textContent = "…";
  let line = "";
  try{
    const r = await fetch("/api/act", {method:"POST", headers:{...H,"Content-Type":"application/json"},
      body: JSON.stringify({action, arg: arg||"", value:""})});
    const d = await r.json();
    line = (d.output || d.speech || "done").split("\n")[0];
    if(d.started === false) line = "refused: " + line;
  }catch(e){ line = "couldn't reach the console"; }
  say.textContent = line;
  if(btn){
    btn.textContent = line.slice(0, 28);
    setTimeout(() => { btn.textContent = was; btn.disabled = false;
                       btn.style.opacity = ""; }, 4000);
  }
  load();
}

function rowActions(secTitle, line){
  const b = [];
  if(secTitle.startsWith("WHAT YOU COULD DO BETTER")){
    if(line.startsWith("broken")) b.push(["repair it","fix",""]);
    if(line.startsWith("started and left")) b.push(["what did I leave?","say","what did I leave unfinished"]);
    if(line.startsWith("not measured")) b.push(["which ones?","say","what am I working on"]);
    if(line.startsWith("the tool itself")) b.push(["re-check","grade",""]);
  }
  if(secTitle.startsWith("YOUR GOALS")){
    const n = line.split(":")[0].trim();
    if(n) b.push(["dispatch","go",n]);
  }
  return b.map(([l,a,g]) =>
    `<button data-act="${esc(a)}" data-arg="${esc(g)}">${esc(l)}</button>`).join("");
}

function renderSections(){
  document.getElementById("sections").innerHTML = SECTIONS.map((s,i) => `
    <div class="sec" id="sec${i}">
      <h3 data-toggle="${i}">${esc(s.title)}<span style="color:var(--faint)">${s.lines.length}</span></h3>
      <div class="body">
        ${s.lines.map(l => `<div class="li"><span class="txt">${esc(l)}</span>${rowActions(s.title,l)}</div>`).join("")}
        <div class="basis">basis: ${esc(s.basis)}</div>
      </div>
    </div>`).join("");
}

function drawChart(series){
  if(typeof d3 === "undefined") return drawChartPlain(series);
  const svg = d3.select("#chart"); svg.selectAll("*").remove();
  const names = Object.keys(series.goals||{});
  if(!names.length) return;

  // SMALL MULTIPLES, not six lines on one axis.
  //
  // The first cut drew all six as overlapping steps in near-identical golds
  // and it hid the thing that matters: the records are wildly uneven.
  // market-ready has 14 snapshots over 3 days; three goals were last measured
  // on 08-23. Sharing one axis drew those three flat to today, which reads as
  // "still being tracked at this level" when the truth is "nobody has
  // measured this in six days" — an absence rendered as a present value, the
  // one defect this tool exists to refuse. Each goal gets its own row, its
  // line stops where its record stops, and the gap after it is drawn as a
  // dotted rule that says so.
  const rows = names.map(n => {
    const seen = new Set();
    const pts = (series.goals[n]||[]).map(p => {
      const t = new Date(p.ts + (p.ts.endsWith("Z")?"":"Z"));
      return isNaN(t) ? null : {t, ts:p.ts, done:p.done, total:p.total,
                                pct: p.total ? 100*p.done/p.total : 0};
    }).filter(Boolean).sort((a,b)=>a.t-b.t)
      // identical consecutive snapshots are the same fact recorded twice;
      // plotting both stacks dots and invents activity
      .filter(p => { const k = p.done+"/"+p.total+"@"+(+p.t); if(seen.has(k)) return false;
                     seen.add(k); return true; });
    return {n, pts};
  }).filter(r => r.pts.length);
  if(!rows.length) return;

  const all = rows.flatMap(r=>r.pts);
  const now = new Date();
  // WIDTH FROM THE CONTAINER, not a constant. Hardcoded 1016 put the
  // done/total and "last measured" labels off the right edge in an 800px
  // pane — the two facts each row exists to deliver, invisible.
  const W = Math.max(560, (document.querySelector("#chart").parentElement.clientWidth || 1016));
  const narrow = W < 780;
  const RH = 34, M = {t:8, r: narrow?152:210, b:20, l: narrow?150:196};
  const Hh = M.t + rows.length*RH + M.b;
  svg.attr("height", Hh).attr("width", W)
     .attr("viewBox", `0 0 ${W} ${Hh}`).attr("preserveAspectRatio","xMinYMin meet");
  const x = d3.scaleTime().domain([d3.min(all,d=>d.t), now]).range([M.l, W-M.r]);
  svg.append("g").attr("class","axis").attr("transform",`translate(0,${Hh-M.b})`)
     .call(d3.axisBottom(x).ticks(5).tickFormat(d3.timeFormat("%b %-d")));

  rows.forEach((r,i) => {
    const top = M.t + i*RH, y = d3.scaleLinear().domain([0,100]).range([top+RH-9, top+5]);
    const last = r.pts[r.pts.length-1];
    const done = last.done >= last.total;
    const col = done ? "#4fb08a" : "#E3B140";
    const g = svg.append("g");

    g.append("text").attr("x", M.l-10).attr("y", top+RH/2+1).attr("text-anchor","end")
     .attr("fill","#d8d4cc").attr("font-size", narrow?11:12)
     .text(narrow && r.n.length>20 ? r.n.slice(0,19)+"\u2026" : r.n)
     .append("title").text(r.n);
    g.append("line").attr("x1",M.l).attr("x2",W-M.r).attr("y1",y(0)).attr("y2",y(0))
     .attr("stroke","#1a1611");

    // the measured span, then the unmeasured tail as a dotted rule
    g.append("path").datum(r.pts).attr("fill","none").attr("stroke",col)
     .attr("stroke-width",1.8)
     .attr("d", d3.line().x(d=>x(d.t)).y(d=>y(d.pct)).curve(d3.curveStepAfter));
    const staleDays = (now - last.t)/864e5;
    if(staleDays > 1.5){
      g.append("line").attr("x1",x(last.t)).attr("x2",x(now))
       .attr("y1",y(last.pct)).attr("y2",y(last.pct))
       .attr("stroke",col).attr("stroke-width",1).attr("opacity",.35)
       .attr("stroke-dasharray","2,4");
    }

    r.pts.forEach((p,j) => {
      const grew = j>0 && p.total > r.pts[j-1].total;
      g.append("circle").attr("cx",x(p.t)).attr("cy",y(p.pct)).attr("r", grew?3.4:2.2)
       .attr("fill", grew ? "#000" : col).attr("stroke", col).attr("stroke-width", grew?1.6:0)
       .append("title").text(`${r.n} — ${p.done}/${p.total}` +
         (grew ? ` · scope widened from ${r.pts[j-1].total}` : "") + ` · ${p.ts.slice(0,10)}`);
    });

    const when = staleDays < 1 ? "today"
               : staleDays < 2 ? "yesterday"
               : `${Math.round(staleDays)}d ago`;
    g.append("text").attr("x", W-M.r+14).attr("y", top+RH/2-3)
     .attr("fill",col).attr("font-size",12).text(`${last.done}/${last.total}`);
    g.append("text").attr("x", W-M.r+14).attr("y", top+RH/2+11)
     .attr("fill","#57524a").attr("font-size",10)
     .text(done ? "done · " + when : "measured " + when);
  });

  const stale = rows.filter(r => (now - r.pts[r.pts.length-1].t)/864e5 > 1.5).length;
  document.getElementById("chart-basis").textContent =
    `${series.points} stamped snapshots · one row per goal, steps not curves — the points are the record · ` +
    `hollow dot = scope widened · dotted tail = unmeasured since` +
    (stale ? ` (${stale} of ${rows.length} goals)` : "");
}

function drawChartPlain(series){
  // The same small multiples with no d3: two linear scales and an SVG string.
  // d3 buys axis ticks and a step generator; neither is worth the page going
  // blank when a CDN is unreachable.
  const svg = document.getElementById("chart");
  svg.innerHTML = "";
  const rows = Object.keys(series.goals||{}).map(n => {
    const pts = (series.goals[n]||[]).map(p => {
      const t = Date.parse(p.ts + (p.ts.endsWith("Z")?"":"Z"));
      return isNaN(t) ? null : {t, ts:p.ts, done:p.done, total:p.total,
                                pct: p.total ? 100*p.done/p.total : 0};
    }).filter(Boolean).sort((a,b)=>a.t-b.t);
    return {n, pts};
  }).filter(r => r.pts.length);
  if(!rows.length) return;
  const W = Math.max(560, svg.parentElement.clientWidth||900), narrow = W < 780;
  const RH = 34, M = {t:8, r: narrow?152:210, b:20, l: narrow?150:196};
  const Hh = M.t + rows.length*RH + M.b, now = Date.now();
  const t0 = Math.min(...rows.flatMap(r=>r.pts.map(p=>p.t)));
  const X = t => M.l + (W-M.r-M.l) * (t-t0) / Math.max(1, now-t0);
  let out = "";
  rows.forEach((r,i) => {
    const top = M.t + i*RH, Y = pct => (top+RH-9) - (pct/100)*(RH-14);
    const last = r.pts[r.pts.length-1], done = last.done >= last.total;
    const col = done ? "#4fb08a" : "#E3B140";
    let d = "";
    r.pts.forEach((p,j) => { d += (j ? `H${X(p.t).toFixed(1)}V${Y(p.pct).toFixed(1)}`
                                     : `M${X(p.t).toFixed(1)},${Y(p.pct).toFixed(1)}`); });
    const stale = (now-last.t)/864e5;
    out += `<text x="${M.l-10}" y="${top+RH/2+1}" text-anchor="end" fill="#d8d4cc"
             font-size="${narrow?11:12}">${esc(narrow&&r.n.length>20?r.n.slice(0,19)+"…":r.n)}</text>`
        + `<line x1="${M.l}" x2="${W-M.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="#1a1611"/>`
        + `<path d="${d}" fill="none" stroke="${col}" stroke-width="1.8"/>`
        + (stale > 1.5 ? `<line x1="${X(last.t)}" x2="${X(now)}" y1="${Y(last.pct)}"
             y2="${Y(last.pct)}" stroke="${col}" stroke-width="1" opacity=".35"
             stroke-dasharray="2,4"/>` : "")
        + r.pts.map((p,j) => {
            const grew = j>0 && p.total > r.pts[j-1].total;
            return `<circle cx="${X(p.t)}" cy="${Y(p.pct)}" r="${grew?3.4:2.2}"
              fill="${grew?"#000":col}" stroke="${col}" stroke-width="${grew?1.6:0}"><title>${
              esc(r.n+" — "+p.done+"/"+p.total+(grew?" · scope widened":"")+" · "+p.ts.slice(0,10))
            }</title></circle>`; }).join("")
        + `<text x="${W-M.r+14}" y="${top+RH/2-3}" fill="${col}" font-size="12">${last.done}/${last.total}</text>`
        + `<text x="${W-M.r+14}" y="${top+RH/2+11}" fill="#57524a" font-size="10">${
            done ? "done" : "measured"} ${stale<1?"today":stale<2?"yesterday":Math.round(stale)+"d ago"}</text>`;
  });
  svg.setAttribute("width", W); svg.setAttribute("height", Hh);
  svg.setAttribute("viewBox", `0 0 ${W} ${Hh}`);
  svg.innerHTML = out;
  const stale = rows.filter(r => (now - r.pts[r.pts.length-1].t)/864e5 > 1.5).length;
  document.getElementById("chart-basis").textContent =
    `${series.points} stamped snapshots · one row per goal · hollow dot = scope widened · ` +
    `dotted tail = unmeasured since` + (stale ? ` (${stale} of ${rows.length} goals)` : "") +
    ` · plain renderer (no d3)`;
}

function initCore2D(){
  // The same face without WebGL: one iris, one breathing ring, driven by the
  // same uAwake/uLoad the shader reads. Plainer, never absent.
  const cv = document.getElementById("core");
  const ctx = cv.getContext("2d");
  uni = {uTime:{value:0}, uAwake:{value:0.18}, uLoad:{value:0}, uAspect:{value:1}};
  const t0 = performance.now();
  (function loop(){
    const w = cv.width = (cv.clientWidth||900) * (devicePixelRatio||1);
    const h = cv.height = 230 * (devicePixelRatio||1);
    const t = (performance.now()-t0)/1000, aw = uni.uAwake.value;
    ctx.clearRect(0,0,w,h);
    const cx = w/2, cy = h/2, R = h*0.42;
    const br = 0.5 + 0.5*Math.sin(t * (aw>0.5 ? 2.4 : 0.7));
    const g = ctx.createRadialGradient(cx,cy,0,cx,cy,R*(aw>0.5?0.55:0.4));
    g.addColorStop(0, `rgba(227,177,64,${0.30+0.55*aw+0.18*br})`);
    g.addColorStop(1, "rgba(227,177,64,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.fill();
    ctx.strokeStyle = `rgba(227,177,64,${0.5+0.3*br})`; ctx.lineWidth = 1.4*(devicePixelRatio||1);
    ctx.beginPath(); ctx.arc(cx,cy,R*(0.80+0.03*br),0,7); ctx.stroke();
    const n = Math.round(uni.uLoad.value*6);
    for(let i=0;i<n;i++){
      const a = (i/6)*Math.PI*2 + t*0.35;
      ctx.beginPath(); ctx.arc(cx+Math.cos(a)*R*0.98, cy+Math.sin(a)*R*0.98, 2.2*(devicePixelRatio||1),0,7);
      ctx.fillStyle = "#E3B140"; ctx.fill();
    }
    requestAnimationFrame(loop);
  })();
}

function initCore(){
  if(typeof THREE === "undefined") return initCore2D();
  const cv = document.getElementById("core");
  const w = cv.clientWidth || 1016, h = 230;
  const renderer = new THREE.WebGLRenderer({canvas:cv, alpha:true, antialias:true});
  renderer.setPixelRatio(Math.min(2, devicePixelRatio||1)); renderer.setSize(w,h,false);
  const scene = new THREE.Scene();
  const cam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  uni = {uTime:{value:0}, uAwake:{value:0.2}, uLoad:{value:0.0},
         uAspect:{value:w/h}};
  const mat = new THREE.ShaderMaterial({
    uniforms: uni, transparent: true,
    vertexShader: document.getElementById("vs").textContent,
    fragmentShader: document.getElementById("fs").textContent });
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), mat);
  scene.add(quad);
  const t0 = performance.now();
  (function loop(){
    uni.uTime.value = (performance.now()-t0)/1000;
    renderer.render(scene,cam);
    requestAnimationFrame(loop);
  })();
  addEventListener("resize", () => {
    if(LAST_SERIES) drawChart(LAST_SERIES);
    const nw = cv.clientWidth||1016; renderer.setSize(nw,h,false); uni.uAspect.value = nw/h;
  });
}

function applyState(s){
  STATE = s;
  const rows = s.live_sessions || [];
  const moving = rows.filter(r=>r.state==="working").length;
  const gate = (s.timing||{}).state || "";
  const awake = !!s.fleet_running || moving>0;
  if(uni){ uni.uAwake.value = awake?1:0.18; uni.uLoad.value = Math.min(1, moving/6); }
  document.getElementById("p-face").innerHTML = awake
    ? "<b>◉ ◉</b> awake" : "── ── watching";
  document.getElementById("p-moving").innerHTML =
    `<b>${moving}</b> moving of ${rows.length} open`;
  document.getElementById("p-gate").textContent = gate ? `gate: ${gate}` : "gate: —";
  // STALE CODE, said out loud. The server holds the code it booted with, so
  // after an edit it can serve confident numbers from a version that no
  // longer exists — it happened twice in one afternoon while I read the page
  // and believed it. A twin you cannot trust to be current is not dependable,
  // and the flag was already in the payload, unused.
  let warn = document.getElementById("p-stale");
  if(s.server_stale){
    if(!warn){
      warn = document.createElement("span");
      warn.id = "p-stale"; warn.className = "pill";
      warn.style.cssText = "border-color:#7a5a1a;color:#E3B140;cursor:pointer";
      warn.title = "the running server predates the code on disk";
      warn.textContent = "⚠ running old code — restart";
      warn.onclick = () => act("restart-hint","");
      document.getElementById("p-gate").after(warn);
    }
  } else if(warn){ warn.remove(); }
}

function fillTargets(){
  // Completion over things that EXIST, not a hand-typed menu: the goals the
  // dispatcher named, the dormant repos it offered, and the questions the
  // branch router actually answers. A palette listing a verb with no target
  // is how "go " with an empty argument launched the whole fleet.
  const dl = document.getElementById("targets");
  if(!dl) return;
  const opts = new Set(["fix", "grade", "go",
                        "what did I leave unfinished", "what is broken",
                        "what am I working on", "who is running right now"]);
  (LAST_PLAN && LAST_PLAN.agents || []).forEach(a => {
    if(a.kind === "goal" && a.name) opts.add("go " + a.name);
    if(a.kind === "revive") opts.add("revive " + a.what);
  });
  dl.innerHTML = [...opts].map(o => `<option value="${esc(o)}">`).join("");
}

function renderSwarm(d){
  LAST_PLAN = d;
  const box = document.getElementById("swarm");
  if(!box) return;
  const rows = (d.agents||[]);
  if(!rows.length && !(d.notes||[]).length){
    box.innerHTML = '<div style="color:var(--faint)">nothing queued and nothing offered.</div>';
    return;
  }
  // The verb each row already has. The plan does not invent a new way to
  // dispatch — it points at the one /api/act the mascot and the page share.
  const verb = a => a.kind === "revive" ? ["revive", a.what]
             : a.kind === "repair" ? ["fix", ""]
             : ["go", a.name || ""];
  // Say what the button will actually do. "run it" on a goal with no name
  // would launch the whole fleet; the label has to name the target or the
  // click is a surprise.
  const label = a => a.kind === "revive" ? "open " + a.what
               : a.kind === "repair" ? "repair now"
               : (a.name ? "dispatch " + a.name : "start the fleet");
  box.innerHTML = rows.map(a => {
    const [v, arg] = verb(a);
    const cost = a.usd == null ? `\u2264${(a.out_tokens||0).toLocaleString()} tokens`
                               : `\u2264$${a.usd.toFixed(2)}`;
    const max = Math.max(...rows.map(x=>x.out_tokens||0), 1);
    const bar = Math.round(60 * (a.out_tokens||0) / max);
    return `<div class="li"><span class="txt">
        <b style="color:var(--gold);font-weight:500">${esc(a.kind)}</b> ${esc(a.what)}
        <div style="color:var(--faint);font-size:11px">${esc(a.why)}</div>
        <div style="color:var(--dim);font-size:11px">send ${esc(a.model)} at ${esc(a.effort||"default")} effort
          [${esc(a.basis)}] \u00b7 up to ${a.turns} turns, ${cost}
          <span style="display:inline-block;height:3px;width:${bar}px;background:var(--gold);
            opacity:.5;vertical-align:middle;margin-left:8px"></span></div>
      </span><button data-act="${esc(v)}" data-arg="${esc(arg)}"
        title="${esc(a.policy_why||"")}">${esc(label(a))}</button></div>`;
  }).join("") + (d.notes||[]).map(n =>
      `<div class="li"><span class="txt" style="color:var(--faint)">note \u2014 ${esc(n.what)}: ${esc(n.why)}</span></div>`
    ).join("") + `<div class="basis">${rows.length} planned \u00b7 projected \u2264${
      (d.projected_out_tokens||0).toLocaleString()} output tokens${
      d.priced ? " \u2248 $" + d.projected_usd : " \u00b7 priced in tokens: no price table on this machine"}</div>`;
}

async function load(){
  const [t, s] = await Promise.all([
    fetch("/api/twin",{headers:H}).then(r=>r.json()),
    fetch("/api/state",{headers:H}).then(r=>r.json())]);
  SECTIONS = t.sections || [];
  renderSections(); applyState(s);
  if(t.series){ LAST_SERIES = t.series; drawChart(t.series); }
  fetch("/api/swarm",{headers:H}).then(r=>r.json())
    .then(d => { renderSwarm(d); fillTargets(); })
    .catch(()=>{ const b=document.getElementById("swarm");
                 if(b) b.textContent = "couldn't reach the dispatcher"; });
}

document.addEventListener("click", e => {
  const b = e.target.closest("button[data-act]");
  if(b){ act(b.dataset.act, b.dataset.arg, b); return; }
  const h = e.target.closest("h3[data-toggle]");
  if(h) h.parentElement.classList.toggle("collapsed");
});

const cmd = document.getElementById("cmd");
cmd.addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  const v = cmd.value.trim(); if(!v) return;
  const w = v.split(/\s+/)[0].toLowerCase();
  const verbs = ["go","fix","grade","revive","clear","tell"];
  if(verbs.includes(w)) act(w, v.slice(w.length).trim());
  else act("say", v);
  cmd.value = "";
});
addEventListener("keydown", e => {
  if(document.activeElement === cmd){ if(e.key==="Escape") cmd.blur(); return; }
  if(e.key === "/"){ e.preventDefault(); cmd.focus(); }
  if(e.key === "g") act("go","");
  if(e.key === "f") act("fix","");
  if(e.key === "r") act("grade","");
});

function feed(){
  try{
    const es = new EventSource("/api/stream");
    const box = document.getElementById("feed");
    es.onmessage = ev => {
      let d; try{ d = JSON.parse(ev.data); }catch(_){ return; }
      applyState(Object.assign({}, STATE, d));
      const rows = (d.live_sessions||[]).filter(r=>r.state==="working").slice(0,4);
      box.innerHTML = rows.length
        ? rows.map(r=>`▸ ${esc(r.label||r.sid)} — ${esc(r.last_file||"moving")}`).join("<br>")
        : "nothing moving right now";
    };
    es.onerror = () => { es.close(); setTimeout(feed, 5000); };
  }catch(e){}
}

// DEPENDABILITY: each of these is independent, so one failing never blanks
// the page. Measured 2026-08-29 — with the CDN unreachable, initCore threw on
// THREE.WebGLRenderer and, because it ran FIRST in a bare sequence, load() and
// feed() never ran at all: no face, no sections, no chart. One missing script
// tag took the whole console. Now each is guarded and each has a
// library-free fallback, so CLAUD-E works with no internet at all.
function guarded(name, fn){ try{ fn(); }catch(e){ console.warn(name, e.message); } }
guarded("core", initCore); guarded("load", load); guarded("feed", feed);
setInterval(() => guarded("load", load), 60000);
</script>
