# Render Blueprint for the read-only remote VIEW.
# Lives at the repo ROOT so a Blueprint apply auto-detects it — no custom
# "Blueprint Path" to type. It builds deploy/remote-view/Dockerfile (rootDir
# below), which runs the exact, tested remote.py (test_remote.py, 4/4).
# Render injects $PORT and a public HTTPS URL. Both tokens are generated by
# Render — nothing is baked in and the owner never types a secret.
# Read VIEW_SECRET off the Render dashboard once; the phone URL is
#   https://<service>.onrender.com/?k=<VIEW_SECRET>
#
# One-time owner step (no card): render.com -> sign in with GitHub -> New ->
# Blueprint -> pick this repo (prashantpandey-creator/meditate) -> Apply.
#
# Note: free web services sleep after ~15 min idle (30-60s cold start). The
# heartbeat push and the first phone view both wake it; that is acceptable for a
# glance-at-your-brain view, not a hot path.
services:
  - type: web
    name: meditate-remote-view
    runtime: docker
    plan: free
    rootDir: deploy/remote-view   # build context + Dockerfile live here
    envVars:
      - key: INGEST_TOKEN
        generateValue: true   # Render mints it; used by `meditate remote push`
      - key: VIEW_SECRET
        generateValue: true   # Render mints it; goes in the phone URL's ?k=
