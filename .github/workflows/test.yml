name: tests

# Every suite, on every push, on a real macOS runner.
#
# This project's own doctor is the gate locally; CI exists so the gate keeps
# holding on a machine that is NOT the author's. Four suites went red the
# first time they ran under a clean HOME — three because they assert on live
# data a new install does not have yet, one because a test named the author's
# own directories. Nothing catches that class except running somewhere else.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show what we are testing on
        run: |
          python3 --version
          echo "HOME=$HOME"

      - name: Install into this runner's HOME
        # launchctl exists on the runner but there is no user session to load
        # an agent into, so the heartbeat step is expected to warn, not fail.
        run: bash install.sh || true

      - name: Build the mascot, so its no-ship guarantee is actually tested
        # test_mascot_route.py drives the REAL binary. mascot/Casper.app/ is
        # gitignored, so on a fresh checkout the binary was always absent, and
        # all three of its tests printed "(skipped: mascot not built here)"
        # and returned success — including the one asserting Casper REFUSES to
        # push or deploy by voice. Measured 2026-08-25 by mutation: deleting
        # the refusal block from routeDecision and recompiling makes the real
        # binary answer "OFFER meditate fix" to "push the fix", and every
        # Python test stayed green. The safety guarantee had zero CI coverage
        # for as long as it has existed. macos-latest has swiftc; build it.
        run: bash mascot/build.sh

      - name: The suite
        run: |
          set -e
          fail=0
          for t in test_*.py; do
            [ "$t" = "test_doctor.py" ] && continue
            if python3 "$t" > "/tmp/$t.log" 2>&1; then
              echo "ok   $t"
            else
              echo "FAIL $t"; sed -n '1,40p' "/tmp/$t.log"; fail=1
            fi
          done
          exit $fail

      - name: Doctor
        # A runner has no Claude Code binary and has never run a stilling
        # pass; neither says anything about this code. Fail on everything
        # else — tests, hook wiring, heartbeat registration.
        run: |
          python3 doctor.py --json > /tmp/doc.json || true
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/doc.json"))["data"]
          allowed = {"prerequisites", "stillness_overdue"}
          real = [i for i in d["issues"] if i not in allowed]
          print("issues:", d["issues"], "-> failing on:", real or "none")
          raise SystemExit(1 if real else 0)
          PY

      - name: The page's JavaScript must parse
        # A syntax error here serves HTTP 200 with every section blank; it
        # cost this project a whole dashboard once, silently.
        run: python3 test_page_js.py
