name: tests

# Every suite, on every push, on a real macOS runner AND a real Linux one.
#
# This project's own doctor is the gate locally; CI exists so the gate keeps
# holding on a machine that is NOT the author's. Four suites went red the
# first time they ran under a clean HOME — three because they assert on live
# data a new install does not have yet, one because a test named the author's
# own directories. Nothing catches that class except running somewhere else.
#
# The Linux job exists to prove the cron fallback (install.sh's path when
# launchd is absent) actually works end to end, not just that it parses —
# ubuntu-latest has no launchctl, so install/doctor/uninstall are forced onto
# the same cron path a real Linux user hits.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show what we are testing on
        run: |
          python3 --version
          echo "HOME=$HOME"

      - name: Install into this runner's HOME
        # launchctl exists on the runner but there is no user session to load
        # an agent into, so the heartbeat step is expected to warn, not fail.
        run: bash install.sh || true

      - name: The suite
        run: |
          set -e
          fail=0
          for t in test_*.py; do
            [ "$t" = "test_doctor.py" ] && continue
            if python3 "$t" > "/tmp/$t.log" 2>&1; then
              echo "ok   $t"
            else
              echo "FAIL $t"; sed -n '1,40p' "/tmp/$t.log"; fail=1
            fi
          done
          exit $fail

      - name: Doctor
        # A runner has no Claude Code binary and has never run a stilling
        # pass; neither says anything about this code. Fail on everything
        # else — tests, hook wiring, heartbeat registration.
        run: |
          python3 doctor.py --json > /tmp/doc.json || true
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/doc.json"))["data"]
          allowed = {"prerequisites", "stillness_overdue"}
          real = [i for i in d["issues"] if i not in allowed]
          print("issues:", d["issues"], "-> failing on:", real or "none")
          raise SystemExit(1 if real else 0)
          PY

      - name: The page's JavaScript must parse
        # A syntax error here serves HTTP 200 with every section blank; it
        # cost this project a whole dashboard once, silently.
        run: python3 test_page_js.py

  suite-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show what we are testing on
        run: |
          python3 --version
          echo "HOME=$HOME"
          command -v launchctl && echo "launchctl present (unexpected on Linux)" || echo "no launchctl — cron fallback is the path under test"
          command -v crontab && echo "crontab present" || echo "no crontab either"

      - name: Install into this runner's HOME
        run: bash install.sh || true

      - name: The suite
        run: |
          set -e
          fail=0
          for t in test_*.py; do
            [ "$t" = "test_doctor.py" ] && continue
            if python3 "$t" > "/tmp/$t.log" 2>&1; then
              echo "ok   $t"
            else
              echo "FAIL $t"; sed -n '1,40p' "/tmp/$t.log"; fail=1
            fi
          done
          exit $fail

      - name: Doctor — heartbeat must be loaded via cron, not launchd
        # always(): this is the one signal this job exists to prove — it must
        # not go dark just because an unrelated suite in the step above is red.
        # Calls doctor.run(run_tests=False) directly instead of the --json CLI
        # so it does not re-run (and re-couple to) that same suite.
        if: always()
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, ".")
          import doctor
          d = doctor.run(run_tests=False)["data"]
          hb = d["heartbeat"]
          print("heartbeat:", hb)
          assert hb["mechanism"] == "cron", "expected the cron fallback, got: %r" % hb
          assert hb["loaded"] is True, hb
          PY

      - name: Uninstall must remove the cron heartbeat
        if: always()
        run: |
          bash uninstall.sh
          if crontab -l 2>/dev/null | grep -q meditate-heartbeat; then
            echo "cron heartbeat survived uninstall"; exit 1
          fi

      - name: The page's JavaScript must parse
        if: always()
        run: python3 test_page_js.py
